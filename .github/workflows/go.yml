name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # github.com/r2day/base 与 github.com/r2day/rest 的源仓库已不在 GitHub，proxy.golang.org 返回 404；
      # 回退到仍缓存这些版本的 goproxy.cn（go.sum 校验内容不变）。
      GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Show Go version
        run: |
          go version
          go env GOPATH
          go env GOROOT

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # 安全检查
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" -test=false ./...

      # 代码质量检查
      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2

      - name: Show golangci-lint version
        run: |
          "$(go env GOPATH)/bin/golangci-lint" version

      - name: Run golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=10m

      # Build
      - name: Build
        run: |
          go build -v ./...

      # Test
      - name: Test
        run: |
          go test -v ./...